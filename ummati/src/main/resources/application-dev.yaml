spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ummati_db
    username: ummati
    password: ummati

  # ===== FLYWAY =====
  # Les migrations db/migration/V*.sql sont appliquées automatiquement au démarrage.
  #
  # baseline-on-migrate est volontairement DÉSACTIVÉ. Il avait été mis à true avec
  # baseline-version: 17 pour adopter les bases migrées à la main avant Flyway. Ce
  # réglage n'était juste qu'un seul jour : il affirme « ce schéma est à V17 » sans
  # rien vérifier. Dès que la base a dérivé — ici elle était à V18 — Flyway rejoue une
  # migration déjà passée et le démarrage casse sur un « column already exists »
  # incompréhensible, très loin de la vraie cause.
  #
  # Sans lui, une base sans historique échoue immédiatement avec un message explicite
  # de Flyway. La marche à suivre est alors dans LANCEMENT.md : comparer le schéma aux
  # migrations, poser la ligne de base à la bonne version, ou repartir d'une base
  # vierge. Sur une base vide (le cas normal), rien de tout cela ne s'applique et
  # l'intégralité des scripts est jouée depuis V1.
  flyway:
    enabled: true
    baseline-on-migrate: false
    out-of-order: false

  # ===== SMTP DEV (MailHog) =====
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

logging:
  level:
    orga.takwa.ummati: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG

