# Reverse proxy Ummati : point d'entrée unique de la plateforme.
#
# /api et /uploads vont au backend Spring, tout le reste au serveur SSR Angular.
# Cette séparation est ce qui permet au navigateur d'appeler « /api/v1/... » en
# relatif, exactement comme en développement avec proxy.conf.json.

upstream ummati_backend  { server backend:8080; }
upstream ummati_frontend { server frontend:4000; }

server {
    listen 80;
    server_name _;

    # Les uploads d'images vont jusqu'à 5 Mo, les documents jusqu'à 10 Mo.
    client_max_body_size 15m;

    # Le backend applique déjà ces en-têtes sur ses réponses ; on les pose aussi ici
    # pour couvrir celles servies par le SSR.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://ummati_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ÉCRASE l'en-tête au lieu de l'enrichir. $proxy_add_x_forwarded_for aurait
        # conservé la valeur envoyée par le client en tête de liste : comme le backend
        # lit le premier élément pour appliquer son quota, n'importe qui aurait pu se
        # fabriquer une IP différente à chaque requête et contourner le rate limiting.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://ummati_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Le nom des fichiers est un UUID : le contenu ne change jamais sous une URL
        # donnée, il peut donc être mis en cache longtemps par le navigateur.
        expires 7d;
    }

    # Préfixe et non correspondance exacte : /actuator/health/readiness et
    # /actuator/health/liveness doivent aussi atteindre le backend.
    location /actuator/health {
        proxy_pass http://ummati_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://ummati_frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_read_timeout 60s;
    }
}
