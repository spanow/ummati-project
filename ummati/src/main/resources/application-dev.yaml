spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ummati_db
    username: ummati
    password: ummati

  # ===== FLYWAY =====
  # Les migrations db/migration/V*.sql sont appliquées automatiquement au démarrage.
  # baseline-version = 17 : reprise en main des bases dev créées « à la main » avant
  # l'activation de Flyway (schéma déjà à jour jusqu'à V17, historique absent).
  # Flyway pose alors la ligne de base à 17 et n'exécute que V18 et suivantes.
  # Sur une base vide, ce réglage est sans effet : tout est joué depuis V1.
  # → Voir LANCEMENT.md pour vérifier l'état de flyway_schema_history / repartir de zéro.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 17
    out-of-order: false

  # ===== SMTP DEV (MailHog) =====
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

logging:
  level:
    orga.takwa.ummati: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG

