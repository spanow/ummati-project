spring:
  application:
    name: ummati

  # ===== DATABASE =====
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ummati}
    username: ${DB_USERNAME:ummati}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ===== FLYWAY =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ===== MAIL =====
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ===== CACHE =====
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  # ===== THYMELEAF (email templates) =====
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  # ===== ASYNC =====
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100

  # ===== FILE UPLOAD =====
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# ===== APP CONFIG =====
app:
  jwt:
    secret: ${JWT_SECRET:changeThisSecretInProductionItMustBeAtLeast256BitsLong!!}
    access-token-expiration-ms: 900000       # 15 min
    refresh-token-expiration-ms: 604800000   # 7 jours (clients web, JWT sans état)
    # Sessions des apps installées : jeton opaque stocké, rotatif et révocable. La
    # durée longue est tenable précisément parce que la rotation limite la fenêtre
    # d'exploitation d'un jeton volé et que la révocation reste possible.
    native-refresh-token-expiration-days: ${NATIVE_REFRESH_DAYS:90}
  mail:
    from: ${MAIL_FROM:noreply@ummati.org}
    sender-name: Ummati
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size-mb: 10
    allowed-types: application/pdf,image/jpeg,image/png,application/vnd.openxmlformats-officedocument.wordprocessingml.document
  base-url: ${APP_BASE_URL:http://localhost:8080}
  admin:
    email: ${ADMIN_EMAIL:admin@ummati.org}
    password: ${ADMIN_PASSWORD:Admin123!}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  security:
    # Rate limiting /auth/** : source de l'IP client.
    # false  → request.getRemoteAddr() (exposition directe, valeur sûre par défaut).
    # true   → premier élément de X-Forwarded-For. À n'activer QUE derrière un reverse
    #          proxy de confiance qui réécrit l'en-tête : sinon n'importe qui peut se
    #          fabriquer une IP par requête et échapper au quota.
    #          À l'inverse, laisser false derrière un proxy fait partager un unique
    #          compteur à tous les utilisateurs (IP du proxy) et bloque les connexions.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:BPLSJxSB3QAA1XsJVFED-6HGGyJmFios6ETEo9MJ-7RmbPOXioh_0WsOUPorDEpCbP_PaEJ3wGyo0t3f93y2sU4}
    private-key: ${VAPID_PRIVATE_KEY:AM_NeFGDjso48CY-G965jKrTatAREp-TA-1KCPcJgbJI}
    subject: ${VAPID_SUBJECT:mailto:admin@ummati.org}

  # Notifications des apps installées (iOS/Android). Sans identifiants, le canal natif
  # est simplement inactif : l'application démarre et fonctionne normalement.
  # Renseigner l'un OU l'autre — le JSON en variable d'environnement est préférable en
  # conteneur, le fichier est plus commode en local.
  fcm:
    credentials-json: ${FCM_CREDENTIALS_JSON:}
    credentials-path: ${FCM_CREDENTIALS_PATH:}

# ===== ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ===== SPRINGDOC =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ===== LOGGING =====
logging:
  level:
    orga.takwa.ummati: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

