name: CI

# Vérifie chaque poussée et chaque pull request : compilation, tests des deux côtés,
# et construction effective des images Docker. Le dernier point est ce qui empêche de
# fusionner du code qui compile mais ne se déploie pas.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Une nouvelle poussée annule la vérification en cours de la même branche.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Tests
        working-directory: ummati
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publier les rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: ummati/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend — tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ummati-front/package-lock.json

      - name: Installer les dépendances
        working-directory: ummati-front
        run: npm ci

      - name: Tests
        working-directory: ummati-front
        run: npm test

      - name: Build de production
        working-directory: ummati-front
        run: npm run build

  deploiement:
    name: Déploiement depuis zéro
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Ce job monte la stack complète sur une base vierge, exactement comme une première
    # installation. Il attrape la classe de bugs que les tests unitaires ne voient pas :
    # une migration qui ne passe que sur une base déjà migrée, une auto-configuration
    # absente, un healthcheck qui interroge une URL protégée. Trois défauts de ce type
    # existaient avant sa mise en place.
    steps:
      - uses: actions/checkout@v4

      - name: Générer des secrets de test
        run: |
          cp .env.example .env
          {
            echo "DB_PASSWORD=$(openssl rand -base64 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_PASSWORD=$(openssl rand -base64 18)"
            echo "PUBLIC_URL=http://localhost:8090"
            echo "HTTP_PORT=8090"
          } >> .env

      - name: Démarrer la stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Vérifier les parcours essentiels
        run: |
          set -e
          echo "— page d'accueil (rendu serveur)"
          curl -fsS -o /dev/null http://localhost:8090/
          echo "— recherche de missions"
          curl -fsS -o /dev/null "http://localhost:8090/api/v1/events?size=1"
          echo "— recherche plein texte"
          curl -fsS -o /dev/null "http://localhost:8090/api/v1/events?q=maraude"
          echo "— recherche géolocalisée"
          curl -fsS -o /dev/null "http://localhost:8090/api/v1/events?lat=48.85&lng=2.35&radiusKm=25&sort=distance"
          echo "— création de compte"
          curl -fsS -o /dev/null -X POST http://localhost:8090/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@ummati.org","password":"MotDePasseCI123!","firstName":"CI","lastName":"Test"}'
          echo "Tous les parcours répondent."

      - name: Vérifier que toutes les migrations sont passées
        run: |
          applied=$(docker compose exec -T db psql -U ummati -d ummati -tAc \
            "SELECT count(*) FROM flyway_schema_history WHERE success = true")
          expected=$(ls ummati/src/main/resources/db/migration/V*.sql | wc -l)
          echo "migrations appliquées : $applied / $expected attendues"
          test "$applied" -eq "$expected"

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail 80

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

  secrets-scan:
    name: Aucun secret par défaut hors du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier qu'aucun fichier .env n'est committé
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::Un fichier .env est committé : il contient les secrets de production."
            exit 1
          fi
          echo "OK — aucun .env versionné."
