spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ummati_db
    username: ummati
    password: ummati

  flyway:
    enabled: false

  # ===== SMTP DEV (MailHog) =====
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

logging:
  level:
    orga.takwa.ummati: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG

