<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
  <div style="background: #1976d2; padding: 20px; border-radius: 8px 8px 0 0; text-align: center;">
    <h1 style="margin: 0; color: white;" th:text="${appName}">Ummati</h1>
  </div>
  <div style="background: #fff; padding: 30px; border: 1px solid #eee; border-radius: 0 0 8px 8px;">
    <p>Bonjour <strong th:text="${firstName}">Prénom</strong>,</p>
    <h2>📅 Votre inscription est confirmée !</h2>
    <p>Vous êtes inscrit(e) à l'événement <strong th:text="${eventTitle}">Titre</strong>.</p>
    <table style="width: 100%; margin: 16px 0; font-size: 0.95rem;">
      <tr><td style="color:#888;padding:4px 0;">📍 Lieu</td><td th:text="${location}">Paris</td></tr>
      <tr><td style="color:#888;padding:4px 0;">🗓 Date</td><td th:text="${startDate}">Date</td></tr>
    </table>
    <div style="text-align: center; margin: 24px 0;">
      <a th:href="${eventUrl}" style="background: #1976d2; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold;">Voir l'événement</a>
    </div>
    <p style="color: #999; font-size: 12px;">Ummati — La plateforme du bénévolat solidaire</p>
  </div>
</body>
</html>
