<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px;">
    <h2 style="color: #1976d2;">Confirmez votre email</h2>
    <p>Bonjour <strong th:text="${firstName}">Prénom</strong>,</p>
    <p>Merci de vous être inscrit(e) sur <strong th:text="${appName}">Ummati</strong> !</p>
    <p>Cliquez sur le bouton ci-dessous pour confirmer votre adresse email :</p>
    <p style="text-align: center; margin: 30px 0;">
        <a th:href="${verificationUrl}"
           style="background-color: #1976d2; color: white; padding: 12px 32px; text-decoration: none; border-radius: 4px; font-size: 16px;">
            Confirmer mon email
        </a>
    </p>
    <p style="color: #666; font-size: 14px;">Ce lien expire dans 24 heures.</p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;"/>
    <p style="color: #999; font-size: 12px;">Si vous n'avez pas créé de compte, ignorez cet email.</p>
</body>
</html>
