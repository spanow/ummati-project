<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px;">
    <h2 style="color: #1976d2;">Bienvenue sur Ummati ! 🎉</h2>
    <p>Bonjour <strong th:text="${firstName}">Prénom</strong>,</p>
    <p>Votre compte a été créé avec succès. Vous faites maintenant partie de la communauté <strong th:text="${appName}">Ummati</strong> !</p>
    <p>Commencez par compléter votre profil et découvrir les organisations près de chez vous.</p>
    <p style="text-align: center; margin: 30px 0;">
        <a th:href="${loginUrl}"
           style="background-color: #1976d2; color: white; padding: 12px 32px; text-decoration: none; border-radius: 4px; font-size: 16px;">
            Se connecter
        </a>
    </p>
</body>
</html>
