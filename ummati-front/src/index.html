<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Ummati — Bénévolat &amp; Gestion d'ONG</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ummati connecte les bénévoles avec les associations. Trouvez votre mission, développez vos compétences, faites la différence." />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      Sans manifeste, iOS refuse l'ajout à l'écran d'accueil — et comme Safari ne
      délivre les notifications web qu'aux sites ainsi installés, le Web Push déjà
      implémenté (push-sw.js) était inatteignable sur iPhone.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ummati" />

    <!--
      Thème & langue appliqués AVANT le premier rendu.
      Sans ça, la page s'affiche en clair puis bascule en sombre (flash blanc),
      et le RTL arabe saute d'un cran au bootstrap Angular.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var stored = localStorage.getItem('ummati_theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');

          if (localStorage.getItem('ummati_lang') === 'ar') {
            root.setAttribute('lang', 'ar');
            root.setAttribute('dir', 'rtl');
          }
        } catch (e) {
          /* localStorage indisponible (mode privé strict) : on reste en clair. */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Corps de texte (latin + arabe) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Titres : serif douce et humaine (axes optiques + SOFT/WONK) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,0..100,0..1&display=swap"
      rel="stylesheet"
    />
    <!--
      Icônes : Material Symbols Rounded (variable : graisse, remplissage, grade).
      display=block évite d'afficher le nom de l'icône en clair pendant le chargement.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
