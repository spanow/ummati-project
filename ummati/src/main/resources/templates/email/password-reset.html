<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px;">
    <h2 style="color: #1976d2;">Réinitialisation de mot de passe</h2>
    <p>Bonjour <strong th:text="${firstName}">Prénom</strong>,</p>
    <p>Vous avez demandé la réinitialisation de votre mot de passe.</p>
    <p style="text-align: center; margin: 30px 0;">
        <a th:href="${resetUrl}"
           style="background-color: #1976d2; color: white; padding: 12px 32px; text-decoration: none; border-radius: 4px; font-size: 16px;">
            Réinitialiser mon mot de passe
        </a>
    </p>
    <p style="color: #666; font-size: 14px;">Ce lien expire dans 1 heure.</p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;"/>
    <p style="color: #999; font-size: 12px;">Si vous n'avez pas fait cette demande, ignorez cet email.</p>
</body>
</html>
