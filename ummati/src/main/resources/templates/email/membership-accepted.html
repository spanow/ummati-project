<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
  <div style="background: #1976d2; padding: 20px; border-radius: 8px 8px 0 0; text-align: center;">
    <h1 style="margin: 0; color: white;" th:text="${appName}">Ummati</h1>
  </div>
  <div style="background: #fff; padding: 30px; border: 1px solid #eee; border-radius: 0 0 8px 8px;">
    <p>Bonjour <strong th:text="${firstName}">Prénom</strong>,</p>
    <h2>✅ Votre adhésion a été acceptée !</h2>
    <p>Votre demande d'adhésion à l'organisation <strong th:text="${orgName}">Nom ONG</strong> a été <strong>acceptée</strong>.</p>
    <p>Vous pouvez désormais voir les événements internes et participer aux activités de l'ONG.</p>
    <div style="text-align: center; margin: 24px 0;">
      <a th:href="${orgUrl}" style="background: #1976d2; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold;">Voir l'organisation</a>
    </div>
    <p style="color: #999; font-size: 12px;">Ummati — La plateforme du bénévolat solidaire</p>
  </div>
</body>
</html>
